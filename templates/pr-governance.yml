# Copy to <your-repo>/.github/workflows/pr-governance.yml.
#
# Contribution governance via the gh-workflows reusables. The stub owns triggers/permissions;
# logic lives in gh-workflows. Pin @main to always-current, or @v1 once you want stability.
#
# NOTE: this is a COPY, not a reference. Editing the template in gh-workflows does NOT reach
# repos that already copied it - each consumer has its own file and must be updated separately.
#
# Adopting incrementally? `repo-docs` takes a `skip` input so you can land the docs one at a
# time instead of blocking every PR until they all exist.
name: PR Governance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contributor-check:
    uses: Ait0u5hi/gh-workflows/.github/workflows/reusable-contributor-check.yml@v1

  crossplatform-lint:
    uses: Ait0u5hi/gh-workflows/.github/workflows/reusable-crossplatform-lint.yml@v1

  repo-docs:
    uses: Ait0u5hi/gh-workflows/.github/workflows/reusable-repo-docs.yml@v1
    with:
      # Until the checkers are released to the v1 tag, fetch them from main.
      # Drop this line once v1 has been retagged.
      tools-ref: main
    #   skip: SECURITY.md          # while adopting incrementally
    #   require-standard-link: true

  pr-title:
    uses: Ait0u5hi/gh-workflows/.github/workflows/reusable-pr-title.yml@v1

  doc-commands:
    uses: Ait0u5hi/gh-workflows/.github/workflows/reusable-doc-commands.yml@v1
    with:
      tools-ref: main   # drop once v1 has been retagged
      paths: 'CONTRIBUTING.md'
