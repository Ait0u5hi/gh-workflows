# Copy to .github/workflows/label.yml — OPTIONAL. Path-based PR labels.
# Requires a .github/labeler.yml in the repo (starter in this directory).
name: Labeler

on: [pull_request_target]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
