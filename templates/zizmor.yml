# Copy to .github/zizmor.yml in caller repos. Lets the meta-lint zizmor pass
# accept ref-pinned calls into our own reusable-workflows repo (@v2 moving
# tag) while still requiring hash-pins for everything third-party.
rules:
  unpinned-uses:
    config:
      policies:
        "Ait0u5hi/*": ref-pin
        "*": hash-pin
  # zizmor >= 1.30 flags `uses: ./...` and suggests GitHub's `$/...`
  # self-repository syntax, but actionlint (1.7.12, the latest release)
  # still rejects `$/...`. Re-enable once actionlint accepts it
  # (rhysd/actionlint#732).
  self-repository:
    disable: true
