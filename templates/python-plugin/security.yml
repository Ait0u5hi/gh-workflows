# Copy to .github/workflows/security.yml. The pull-requests:read grant is
# required — the reusable's gitleaks job cannot exceed what the caller grants.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    uses: Ait0u5hi/gh-workflows/.github/workflows/reusable-security.yml@v1
