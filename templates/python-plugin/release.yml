# Copy to .github/workflows/release.yml. Requires a cliff.toml at the repo
# root. contents:write is required for the release + changelog commit.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: Ait0u5hi/gh-workflows/.github/workflows/reusable-release.yml@v1
    with:
      plugin-manifest: true
