# Copy to .github/workflows/deep-lint.yml. Weekly + manual only — super-linter
# pulls a large Docker image per run; keep it off the per-PR path (the image
# pull is minutes of wall-clock every run).
name: Deep Lint

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-lint:
    uses: Ait0u5hi/gh-workflows/.github/workflows/reusable-deep-lint.yml@v1
