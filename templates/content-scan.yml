# Copy to .github/workflows/content-scan.yml, then create your patterns file
# at .github/content-scan-patterns.txt (one ripgrep regex per line, `#` for
# comments). The patterns file lives in YOUR repo — this template does not
# ship a wordlist, so gh-workflows never sees consumer-private tokens.
#
# For a repo you are making PUBLIC: the committed file above is itself world
# readable, so it can only safely hold generic/structural patterns —
# journal-voice phrases, RFC1918 ranges, and the like. Your actually-private
# names (real hostnames, project codenames, personal names) belong in a
# CONTENT_SCAN_PATTERNS repo secret instead (same one-regex-per-line format),
# wired in below. Either source works alone; the reusable merges both when
# you set the secret. When it is set, findings are reported as path:line only
# — never the matched text — since Actions logs on a public repo are world
# readable too.
#
# Suggested starting patterns for the COMMITTED file:
#
#   # journal-voice phrases
#   \bfor tonight\b
#   \bnext[- ]session\b
#   \bstopping point\b
#   # RFC1918 LAN addresses
#   \b10\.10\.0\.
#   \b192\.168\.
#
# Suggested starting patterns for the SECRET (private names only):
#
#   your-real-hostname
#   project-codename-x
#   your-full-name
#
# Iterate: whenever a review sweep finds new leaked content, add the pattern
# to whichever source fits (generic → file, private → secret) so it cannot
# recur.
name: Content Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: content-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  content-scan:
    uses: Ait0u5hi/gh-workflows/.github/workflows/reusable-content-scan.yml@v1
    secrets:
      # Optional — omit this whole `secrets:` block if you only use the
      # committed patterns file. Create the secret at
      # Settings → Secrets and variables → Actions → New repository secret.
      patterns: ${{ secrets.CONTENT_SCAN_PATTERNS }}
