# Config for actions/labeler@v7 (referenced by .github/workflows/label.yml).
# changed-files / any-glob-to-any-file syntax (unchanged since labeler v5). See templates/automation/labeler.yml.
docs:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "docs/**"]

workflows:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**", "**/test_*.py", "**/*_test.py"]
