# Reusable: super-linter deep scan (slim image). Deliberately NOT per-PR — the
# image pull is heavy (minutes per run); run it on a weekly schedule plus
# workflow_dispatch (see templates/deep-lint.yml).
name: Reusable Deep Lint

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      default-branch:
        description: Repo default branch (super-linter diffs against it).
        type: string
        default: main
      linter-rules-path:
        description: Directory holding the linter config files (default = repo root).
        type: string
        default: "."
      python-ruff-config:
        description: ruff config filename, relative to linter-rules-path.
        type: string
        default: ruff.toml
      yaml-config:
        description: yamllint config filename, relative to linter-rules-path.
        type: string
        default: .yamllint.yml

permissions:
  contents: read

jobs:
  deep-lint:
    name: super-linter (full codebase)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8
        env:
          VALIDATE_ALL_CODEBASE: true
          # Whitelist mode: naming any VALIDATE_* disables everything else,
          # so pylint/flake8/isort/black do NOT run alongside ruff.
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_YAML: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_BASH: true
          VALIDATE_MARKDOWN: true
          # Config locations are inputs (default = repo root, not .github/linters/)
          # so a repo that keeps configs elsewhere or uses a non-main default
          # branch can adopt this without editing the reusable.
          LINTER_RULES_PATH: ${{ inputs.linter-rules-path }}
          PYTHON_RUFF_CONFIG_FILE: ${{ inputs.python-ruff-config }}
          YAML_CONFIG_FILE: ${{ inputs.yaml-config }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
