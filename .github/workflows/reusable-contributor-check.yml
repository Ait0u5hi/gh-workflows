# Reusable Contributor Attribution Check.
# Fails a PR whose commit author emails have no mapping under
# contributors/emails/<email> in the CALLER repo. Add one with
# scripts/add_contributor.py (vendored from gh-workflows).
#
# Adapted from NousResearch/hermes-agent (MIT, (c) 2025 Nous Research);
# generalized (removed the repo-specific release.py AUTHOR_MAP fallback,
# base branch is an input).
name: Contributor Attribution Check (reusable)

on:
  workflow_call:
    inputs:
      base-ref:
        description: Base branch to diff commits against.
        type: string
        default: main
      runs-on:
        description: Runner label (set to a self-hosted label to move off GitHub-hosted)
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  check-attribution:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history for git log
          persist-credentials: false

      - name: Check for unmapped contributor emails
        env:
          BASE_REF: ${{ inputs.base-ref }}
          # The PR head, not HEAD: on pull_request HEAD is GitHub's synthetic
          # merge commit. Falls back to HEAD for non-PR events.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::the PR head commit is not in this checkout"
            echo "Call this reusable from a pull_request trigger: pull_request_target checks out"
            echo "the base branch, which never contains a fork's commits."
            exit 1
          fi
          MERGE_BASE=$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}")
          # Merge commits included: a merge commit can carry arbitrary changes,
          # so its author is checked like any other.
          NEW_EMAILS=$(git log "${MERGE_BASE}..${HEAD_SHA}" --format='%ae' | sort -u)
          if [ -z "$NEW_EMAILS" ]; then
            echo "No new commits to check."; exit 0
          fi

          # Exact addresses only: a substring match let e.g.
          # x@anthropic.com.evil.io or dependabot@evil.io through.
          EXEMPT_EXACT=(
            noreply@github.com            # commits made in the GitHub web UI
            noreply@anthropic.com         # Claude
            cursoragent@cursor.com        # Cursor agent
          )
          # GitHub id+login noreply addresses (incl. [bot] accounts such as
          # 49699333+dependabot[bot]@...) resolve to a real account. Anchored.
          NOREPLY_RE='^[0-9]+\+[A-Za-z0-9-]+(\[bot\])?@users\.noreply\.github\.com$'
          # The email is used as a file name below: no path separators, no
          # whitespace, no leading dot, exactly one @ (rejects ../../LICENSE).
          VALID_RE='^[^/\\@[:space:].][^/\\@[:space:]]*@[^/\\@[:space:]]+$'

          missing=()
          while IFS= read -r email; do
            exempt=false
            for e in "${EXEMPT_EXACT[@]}"; do
              [ "$email" = "$e" ] && exempt=true
            done
            $exempt && continue
            if [[ "$email" =~ $NOREPLY_RE ]]; then
              continue
            fi
            if ! [[ "$email" =~ $VALID_RE ]]; then
              missing+=("$email|(not a usable email address)")
              continue
            fi
            # VALID_RE already rules out path-shaped emails; a symlinked
            # mapping (an alias address) is fine.
            if [ -f "contributors/emails/${email}" ]; then
              continue
            fi
            author=$(git log "${MERGE_BASE}..${HEAD_SHA}" --author="$email" --format='%an' -1 -F)
            missing+=("$email|($author)")
          done <<< "$NEW_EMAILS"

          if [ "${#missing[@]}" -gt 0 ]; then
            # printf '%s', never echo -e: names and emails are commit
            # metadata the PR author controls, and an interpreted \n would
            # let them start a log line with a workflow command.
            echo ""
            echo "New contributor email(s) without a mapping:"
            for m in "${missing[@]}"; do
              printf '  %s %s\n' "${m%%|*}" "${m#*|}" | tr -d '\r'
            done
            echo ""
            echo "Add a mapping file:"
            for m in "${missing[@]}"; do
              printf '    python3 scripts/add_contributor.py %s <github-username>\n' "${m%%|*}"
            done
            echo ""
            echo "Find a login for an email:  gh api 'search/users?q=EMAIL+in:email' --jq '.items[0].login'"
            exit 1
          fi
          echo "All contributor emails are mapped."
