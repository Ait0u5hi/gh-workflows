# Reusable: ruff lint + optional Hermes plugin manifest validation + meta-lint.
# Callers: see templates/python-plugin/validation.yml
name: Reusable Python Validation

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (set to a self-hosted label to move off GitHub-hosted)
        type: string
        default: ubuntu-latest
      python-version:
        type: string
        default: "3.10"
      plugin-validate:
        description: Validate plugin.yaml + compileall (Hermes plugin repos)
        type: boolean
        default: false
      meta-lint:
        description: Lint the workflows themselves (actionlint + yamllint + zizmor)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

  plugin-validate:
    name: plugin validate
    if: ${{ inputs.plugin-validate }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Validate plugin.yaml
        run: |
          pip install --quiet pyyaml
          python - <<'EOF'
          import yaml

          with open("plugin.yaml") as f:
              manifest = yaml.safe_load(f)
          for key in ("name", "version", "hooks"):
              assert key in manifest, f"plugin.yaml missing required key: {key}"
          print(f"plugin.yaml OK: {manifest['name']} v{manifest['version']}")
          EOF
      - name: Syntax-check all Python sources
        run: python -m compileall -q .

  meta-lint:
    name: meta-lint (actionlint + yamllint + zizmor)
    if: ${{ inputs.meta-lint }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: actionlint (lint the workflows themselves)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint .
      - name: zizmor (workflow security audit)
        run: |
          pip install --quiet zizmor
          zizmor --no-online-audits .github/workflows/
