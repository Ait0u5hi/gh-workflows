# Reusable: CodeQL code scanning (SAST). Matrix by CodeQL language; results go
# to the Security tab (Code Scanning). Based on actions/starter-workflows
# code-scanning/codeql.yml, SHA-pinned to this library's convention.
#
# GitHub Advanced Security gate: CodeQL / SARIF upload requires GHAS, which is
# free on PUBLIC repos but unavailable on personal-account PRIVATE repos. The
# job `if` skips analysis on private repos (visibility != 'private' so public
# and internal still run, and an empty value on some scheduled events errs to
# running). The SARIF-upload step (only) is continue-on-error, so a private repo
# that slips past the visibility skip warns instead of red-X'ing — while a
# genuine misconfig in Initialize CodeQL still fails the job. Same upload
# tolerance as reusable-osv.yml.
#
# Caller stub must grant: security-events: write, actions: read, contents: read.
# See templates/codeql.yml.
name: Reusable CodeQL

on:
  workflow_call:
    inputs:
      allow-untrusted-prs-on-self-hosted:
        description: >-
          Allow this job to run code from a fork (or another repository's) PR when
          runs-on is a self-hosted runner. Only safe on ephemeral, single-use runners.
        type: boolean
        default: false
      runs-on:
        type: string
        default: ubuntu-latest
      languages:
        description: >-
          JSON array of CodeQL languages. Default is python-only so a pure-
          Python repo does not get a failing "no source found" job; add more,
          e.g. '["python","javascript-typescript"]'.
        type: string
        default: '["python"]'
      build-mode:
        description: CodeQL build-mode (`none` for interpreted languages).
        type: string
        default: none

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Skip on private repos (no GHAS on personal accounts); public/internal run.
    if: ${{ github.event.repository.visibility != 'private' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Refuse untrusted PR code on a self-hosted runner
        # Misconfiguration guard, NOT a security boundary: on pull_request the
        # PR author controls the calling workflow and can drop this call. The
        # controls that actually stop it are repo/org settings (README ->
        # Security model). Runs before checkout, so no PR code has run yet.
        if: ${{ runner.environment == 'self-hosted' && !inputs.allow-untrusted-prs-on-self-hosted }}
        # bash explicitly (a Windows runner defaults to pwsh); written for
        # bash 3.2 too (macOS), so no ${var,,}.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request* | workflow_run)
              # A deleted head repo gives an empty HEAD_REPO: treated as foreign.
              head=$(printf '%s' "$HEAD_REPO" | tr '[:upper:]' '[:lower:]')
              this=$(printf '%s' "$THIS_REPO" | tr '[:upper:]' '[:lower:]')
              if [ "$head" != "$this" ]; then
                echo "::error::refusing PR code from ${HEAD_REPO:-a deleted repo} on a self-hosted runner"
                echo "Use ephemeral runners and set allow-untrusted-prs-on-self-hosted to opt in."
                exit 1
              fi
              ;;
            issue_comment)
              echo "::error::refusing comment-triggered PR code on a self-hosted runner"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
      - name: Perform CodeQL Analysis
        # Fatal on failure: an extractor crash or a failed query-pack download
        # must not leave the job green with no analysis behind it. Upload is
        # split out below so only IT is tolerated.
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: ${{ runner.temp }}/codeql-sarif
      - name: Upload CodeQL results
        # Tolerated: uploading SARIF needs GHAS — free on public repos but
        # absent on a private personal repo that slipped past the visibility
        # skip. Init and analysis failures above still fail the job.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: "/language:${{ matrix.language }}"
