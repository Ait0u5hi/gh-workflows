# Reusable: Node.js CI (npm workspaces friendly). Based on the
# actions/starter-workflows ci/node.js.yml template, with an optional version
# matrix. Callers: see templates/node/ci.yml
name: Reusable Node CI

on:
  workflow_call:
    inputs:
      allow-untrusted-prs-on-self-hosted:
        description: >-
          Allow this job to run code from a fork (or another repository's) PR when
          runs-on is a self-hosted runner. Only safe on ephemeral, single-use runners.
        type: boolean
        default: false
      runs-on:
        type: string
        default: ubuntu-latest
      node-version:
        description: >-
          Legacy single version. If set (non-empty) it OVERRIDES node-versions
          and runs one job — preserves existing single-version callers.
        type: string
        default: ""
      node-versions:
        description: >-
          JSON array of Node versions for the build matrix, e.g. '["22","24"]'.
          Used only when node-version is empty.
        type: string
        default: '["22","24"]'
      run-build:
        type: boolean
        default: true
      run-typecheck:
        type: boolean
        default: false
      test-command:
        description: Test command to run (empty = skip tests)
        type: string
        default: ""
      install-command:
        description: Dependency install command (e.g. "npm ci --ignore-scripts" to skip heavy postinstalls like Electron)
        type: string
        default: npm ci

permissions:
  contents: read

jobs:
  build:
    name: node ${{ matrix.node-version }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Scalar node-version (non-empty) wins as a single-element matrix —
        # keeps existing single-version callers byte-identical; otherwise the
        # node-versions JSON array applies.
        node-version: ${{ fromJSON(inputs.node-version != '' && format('["{0}"]', inputs.node-version) || inputs.node-versions) }}
    steps:
      - name: Refuse untrusted PR code on a self-hosted runner
        # Misconfiguration guard, NOT a security boundary: on pull_request the
        # PR author controls the calling workflow and can drop this call. The
        # controls that actually stop it are repo/org settings (README ->
        # Security model). Runs before checkout, so no PR code has run yet.
        if: ${{ runner.environment == 'self-hosted' && !inputs.allow-untrusted-prs-on-self-hosted }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request* | workflow_run)
              # A deleted head repo gives an empty HEAD_REPO: treated as foreign.
              if [ "${HEAD_REPO,,}" != "${THIS_REPO,,}" ]; then
                echo "::error::refusing PR code from ${HEAD_REPO:-a deleted repo} on a self-hosted runner"
                echo "Use ephemeral runners and set allow-untrusted-prs-on-self-hosted to opt in."
                exit 1
              fi
              ;;
            issue_comment)
              echo "::error::refusing comment-triggered PR code on a self-hosted runner"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"
      - name: Build
        if: ${{ inputs.run-build }}
        run: npm run build --if-present
      - name: Typecheck
        if: ${{ inputs.run-typecheck }}
        run: npm run typecheck --if-present
      - name: Test
        if: ${{ inputs.test-command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"
