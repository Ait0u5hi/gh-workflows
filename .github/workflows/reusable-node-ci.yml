# Reusable: Node.js CI (npm workspaces friendly). Based on the
# actions/starter-workflows ci/node.js.yml template, with an optional version
# matrix. Callers: see templates/node/ci.yml
name: Reusable Node CI

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      node-version:
        description: >-
          Legacy single version. If set (non-empty) it OVERRIDES node-versions
          and runs one job — preserves existing single-version callers.
        type: string
        default: ""
      node-versions:
        description: >-
          JSON array of Node versions for the build matrix, e.g. '["20","22"]'.
          Used only when node-version is empty.
        type: string
        default: '["20","22"]'
      run-build:
        type: boolean
        default: true
      run-typecheck:
        type: boolean
        default: false
      test-command:
        description: Test command to run (empty = skip tests)
        type: string
        default: ""
      install-command:
        description: Dependency install command (e.g. "npm ci --ignore-scripts" to skip heavy postinstalls like Electron)
        type: string
        default: npm ci

permissions:
  contents: read

jobs:
  build:
    name: node ${{ matrix.node-version }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Scalar node-version (non-empty) wins as a single-element matrix —
        # keeps existing single-version callers byte-identical; otherwise the
        # node-versions JSON array applies.
        node-version: ${{ fromJSON(inputs.node-version != '' && format('["{0}"]', inputs.node-version) || inputs.node-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"
      - name: Build
        if: ${{ inputs.run-build }}
        run: npm run build --if-present
      - name: Typecheck
        if: ${{ inputs.run-typecheck }}
        run: npm run typecheck --if-present
      - name: Test
        if: ${{ inputs.test-command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"
