# Reusable: OSV-Scanner dependency-vulnerability scan.
#
# Detection-only — scans the repo's manifests/lockfiles against the OSV
# database and uploads SARIF to the Security tab (Code Scanning > OSV-Scanner).
# It does NOT open PRs or move pins; it reports known CVEs in currently-pinned
# versions so a repo can patch on its own schedule. Complements
# reusable-security.yml (gitleaks = secrets) and the meta-lint zizmor pass
# (workflow hardening) by covering the orthogonal "a pinned dep became
# known-vulnerable" case.
#
# Language-agnostic: OSV-Scanner auto-detects supported manifests (pyproject/
# uv.lock, package-lock.json, Cargo.lock, go.mod, ...) and ignores the rest, so
# one reusable serves the Python and Node consumer repos. Override `scan-args`
# to target specific lockfiles instead of the recursive default.
#
# Two scanner modes, as two JOBS (not two step branches):
#   action (default) — job `scan`: google/osv-scanner-action, a DOCKER action.
#                      Needs a host with docker (GitHub-hosted runners have it).
#   local            — job `scan-local`: the `osv-scanner` binary already on the
#                      runner's PATH. For self-hosted runners without docker.
# Why jobs: the runner pulls every docker action image in a job during job setup,
# BEFORE step `if:` conditions are evaluated. A step-level switch therefore still
# fails with "docker: command not found" on a docker-less runner (measured
# 2026-09-13, ml-development-and-engineering PR #214). A job skipped by a
# job-level `if:` never reaches a runner, so nothing is pulled.
#
# Caller stub must grant: contents: read, security-events: write, actions: read.
# See templates/osv.yml.
name: Reusable OSV Scan

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      scanner:
        description: >-
          "action" (docker-based google/osv-scanner-action, default) or "local"
          (the osv-scanner binary on the runner PATH; for self-hosted runners
          without docker).
        type: string
        default: action
      scan-args:
        description: >-
          Arguments passed to the scanner. Default scans the checkout
          recursively (respecting .gitignore, so vendored dirs like
          node_modules are skipped). Override to pin explicit lockfiles, e.g.
          "--lockfile=uv.lock --lockfile=package-lock.json".
        type: string
        default: "--recursive ."
      fail-on-vuln:
        description: >-
          Fail the job when a vulnerability is found. Default false so a
          pre-existing CVE in a deliberately-held pin does not block merges;
          the SARIF upload still surfaces it in the Security tab.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan dependencies
    # Any value other than 'local' lands here, so a typo fails loudly in the
    # validation step instead of silently skipping both jobs.
    if: ${{ inputs.scanner != 'local' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      # Required to upload the SARIF to code scanning. actions:read is needed
      # by the CodeQL uploader on private repos.
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Validate scanner input
        env:
          SCANNER: ${{ inputs.scanner }}
        run: |
          case "$SCANNER" in
            action) echo "scanner: $SCANNER" ;;
            *) echo "::error::scanner must be 'action' or 'local', got '$SCANNER'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=results.json
            --format=json
            ${{ inputs.scan-args }}
        continue-on-error: true

      - name: Generate SARIF report
        uses: google/osv-scanner-action/osv-reporter-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=${{ inputs.fail-on-vuln }}

      - name: Upload SARIF artifact
        id: upload_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        # Non-fatal: SARIF upload to the code-scanning dashboard requires GitHub
        # Advanced Security, which is free on public repos but not enabled on
        # private personal-account repos. Where it isn't available this warns
        # instead of failing; findings still ship as the SARIF artifact above,
        # and `fail-on-vuln` gates the job independently of the dashboard.
        continue-on-error: true
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif

      - name: Print code-scanning URL
        if: ${{ !cancelled() }}
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "OSV-Scanner results (Security tab):"
          echo "${SERVER_URL}/${REPOSITORY}/security/code-scanning?query=is%3Aopen+branch%3A${REF_NAME}+tool%3Aosv-scanner"

      - name: Fail if artifact upload failed
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::SARIF upload failed — most likely a scanner error earlier in the job."
          exit 1

  scan-local:
    name: Scan dependencies
    # No docker actions in this job: safe on a docker-less self-hosted runner.
    if: ${{ inputs.scanner == 'local' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run scanner (local binary)
        env:
          SCAN_ARGS: ${{ inputs.scan-args }}
          FAIL_ON_VULN: ${{ inputs.fail-on-vuln }}
        run: |
          set -uo pipefail
          command -v osv-scanner >/dev/null || {
            echo "::error::scanner=local but osv-scanner is not on PATH; install the pinned release binary on this runner"
            exit 1
          }
          osv-scanner --version || true
          # Exit codes (osv-scanner docs): 0 no vulns, 1 vulns found,
          # 127 general error, 128 no packages found.
          # Actions runs `run:` under `bash -e`: a bare nonzero exit would abort the
          # step before the case below (measured 2026-09-13: rc 128 on a repo with no
          # manifests killed the step). Capture rc with `|| rc=$?` so -e does not fire.
          rc=0
          # Word-splitting is intentional: scan-args is a flag list.
          # shellcheck disable=SC2086
          osv-scanner scan source --format=sarif --output-file=results.sarif $SCAN_ARGS || rc=$?
          case "$rc" in
            0) echo "No known vulnerabilities." ;;
            1) echo "::warning::OSV-Scanner found vulnerabilities (see results.sarif)."
               if [ "$FAIL_ON_VULN" = "true" ]; then exit 1; fi ;;
            128) echo "No supported manifests or lockfiles found; writing an empty SARIF."
                 printf '%s\n' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"osv-scanner","rules":[]}},"results":[]}]}' > results.sarif ;;
            *) echo "::error::osv-scanner failed with exit code $rc"; exit "$rc" ;;
          esac

      - name: Upload SARIF artifact
        id: upload_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        # Non-fatal for the same reason as in `scan` (no GitHub Advanced Security
        # on private personal-account repos).
        continue-on-error: true
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif

      - name: Fail if artifact upload failed
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::SARIF upload failed — most likely a scanner error earlier in the job."
          exit 1
