# Reusable cross-platform lint: scan changed Python for Windows footguns
# (bare os.killpg / signal.SIGKILL / os.fork / hardcoded /tmp / etc.) using the
# shared linter vendored in gh-workflows. Platform-gated matches are suppressed
# in-source with `# windows-footgun: ok`.
#
# The linter is pulled via the windows-footguns *composite action* (rather than
# a second checkout of this repo) so it resolves with the same grant that already
# loaded this reusable workflow — one fetch, no extra token.
#
# This is an opt-in Ait0u5hi governance workflow: the composite-action ref below
# is hardcoded to this repo. An external fork must repoint the `uses:` at its own
# org, or the check runs against Ait0u5hi's linter rather than the fork's.
name: Cross-platform lint (reusable)

on:
  workflow_call:
    inputs:
      base-ref:
        description: Base branch to diff changed files against.
        type: string
        default: main

permissions:
  contents: read

jobs:
  windows-footguns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed Python for Windows footguns
        # Same-repo composite action, versioned by the same tag as this reusable
        # workflow (they move together on release), so a commit-hash pin would be
        # self-referential and churn on every change. External forks: repoint the
        # org in this `uses:` (see the header note).
        uses: Ait0u5hi/gh-workflows/actions/windows-footguns@v1  # zizmor: ignore[unpinned-uses]
        with:
          base-ref: ${{ inputs.base-ref }}
