# Reusable cross-platform lint: scan changed Python for Windows footguns
# (bare os.killpg / signal.SIGKILL / os.fork / hardcoded /tmp / etc.) using the
# shared linter vendored in gh-workflows. Platform-gated matches are suppressed
# in-source with `# windows-footgun: ok`.
#
# The linter is pulled via the windows-footguns *composite action* rather than a
# second `actions/checkout` of this private repo. A cross-repo `checkout` uses the
# caller's default GITHUB_TOKEN, which cannot read this private repo (git exit
# 128); a same-owner composite action resolves with the same private-access grant
# that already loads this reusable workflow — no token, no visibility change.
name: Cross-platform lint (reusable)

on:
  workflow_call:
    inputs:
      gh-workflows-ref:
        description: Retained for back-compat; the composite action is pinned to the same tag as this reusable workflow.
        type: string
        default: main
      base-ref:
        description: Base branch to diff changed files against.
        type: string
        default: main

permissions:
  contents: read

jobs:
  windows-footguns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed Python for Windows footguns
        # Same-repo composite action, versioned by the same tag as this reusable
        # workflow (they move together on release), so a commit-hash pin would be
        # self-referential and churn on every change. It resolves via the same
        # same-owner private-access grant that already loads this reusable.
        uses: Ait0u5hi/gh-workflows/actions/windows-footguns@fix/crossplatform-composite-action  # zizmor: ignore[unpinned-uses]
        with:
          base-ref: ${{ inputs.base-ref }}
