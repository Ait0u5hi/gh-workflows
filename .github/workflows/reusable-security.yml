# Reusable: gitleaks secret scan over full history.
# Caller stub must grant: permissions: contents: read, pull-requests: read
# Callers: see templates/python-plugin/security.yml
name: Reusable Security

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
