# Reusable: content scan. Greps the tree for caller-supplied patterns
# (private hostnames, internal jargon, journal-voice phrases, etc.) that
# would leak in a public repo but that gitleaks does not flag because
# they are not secrets.
#
# Patterns come from a file committed in the CALLER repo (default
# .github/content-scan-patterns.txt), an optional secrets.patterns, or both —
# this reusable ships no wordlist itself, so gh-workflows stays free of any
# consumer's private tokens. A public caller should put its actually-private
# names (hostnames, codenames, personal names) in the secret, not the
# committed file, since a public repo's committed file is itself world
# readable; keep generic/structural patterns (RFC1918 ranges, journal-voice
# phrases) in the file. See templates/content-scan.yml.
#
# Pattern format (file and secret alike): one ripgrep regex per line. `#`
# starts a line comment. Blank lines and comment lines are ignored.
#
# When secrets.patterns is used, findings are reported as path:line only —
# never the matched text — because public Actions logs are world-readable and
# GitHub's secret masking will not catch a single matched name out of a
# multi-line secret. redact-matches lets a caller force this either way; it
# defaults to "auto" (on iff secrets.patterns is set) to keep today's
# full-line output for existing callers using only the committed file.
#
# The scan logic and the pinned+verified ripgrep install both live in
# actions/content-scan (a composite action), not inline here, so they are
# unit-testable (scripts/tests/test_content_scan.py) and reachable without a
# second checkout of this repo.
name: Reusable Content Scan

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      patterns-file:
        type: string
        default: .github/content-scan-patterns.txt
        description: Path (in the caller repo) to the ripgrep patterns file. Optional if secrets.patterns is set.
      paths:
        type: string
        default: .
        description: Space-separated paths to scan. Defaults to the whole tree.
      redact-matches:
        type: string
        default: auto
        description: >-
          auto (redact iff secrets.patterns is set) | true | false. Redacted
          findings report path:line only, never the matched text.
      pcre2:
        type: boolean
        default: false
        description: Enable PCRE2 (-P) for lookaround patterns, e.g. /home/(?!dev|user|runner).
    secrets:
      patterns:
        required: false
        description: >-
          Newline-separated ripgrep regexes, same format as patterns-file.
          Put private names here for a public caller; merged with
          patterns-file when both are set. Either patterns-file or this
          secret must resolve to at least one pattern.

permissions:
  contents: read

jobs:
  content-scan:
    name: content-scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: Ait0u5hi/gh-workflows/actions/content-scan@v1  # zizmor: ignore[unpinned-uses]
        with:
          patterns-file: ${{ inputs.patterns-file }}
          patterns-secret: ${{ secrets.patterns }}
          paths: ${{ inputs.paths }}
          redact-matches: ${{ inputs.redact-matches }}
          pcre2: ${{ inputs.pcre2 }}
