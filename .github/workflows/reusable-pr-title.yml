# Reusable: enforce a Conventional-Commits PR title. This repo's CONTRIBUTING
# requires conventional commits but nothing enforced PR titles.
#
# SOUNDNESS NOTE (corrected 2026-09-05): the PR title is the landed commit subject ONLY when the
# repo squash-merges. This comment previously asserted that unconditionally; measured, every repo
# in this fleet had allow_merge_commit and allow_rebase_merge enabled alongside squash, so a merge
# or rebase would land the branch's own commit messages and this check would guarantee nothing.
# For this gate to mean what it says, disable merge-commit and rebase on the repo:
#   gh api -X PATCH repos/OWNER/REPO -F allow_merge_commit=false -F allow_rebase_merge=false Pure inline bash — no third-party marketplace
# action — so there is zero supply-chain surface for a check that reads an
# attacker-influenceable value (the PR title). Callers: see templates/pr-title.yml.
name: Reusable PR Title Lint

on:
  workflow_call:
    inputs:
      types:
        description: Pipe-separated allowed Conventional-Commit types.
        type: string
        default: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert

permissions:
  contents: read

jobs:
  lint-title:
    name: conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title
        # Title comes through env, never interpolated into the script body, so a
        # title with quotes/backticks/specials can neither break the regex step
        # nor inject into the runner.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          TYPES: ${{ inputs.types }}
        run: |
          set -uo pipefail
          # <type>[optional (scope)][optional !]: <subject>
          pattern="^(${TYPES})(\([a-z0-9._-]+\))?!?: .+"
          if printf '%s' "$PR_TITLE" | grep -qiE "$pattern"; then
            echo "PR title OK: $PR_TITLE"
          else
            echo "::error::PR title is not a Conventional Commit: '$PR_TITLE'"
            echo "Expected: <type>(optional-scope): subject"
            echo "Allowed types: ${TYPES//|/, }"
            exit 1
          fi
