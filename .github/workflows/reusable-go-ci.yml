# Reusable: generic Go CI — build + vet + test across a Go version matrix, with
# opt-in golangci-lint. No third-party marketplace actions: only first-party
# actions/setup-go, the built-in go toolchain, and a golangci-lint release
# binary downloaded at a pinned version and verified against a hard-coded
# SHA-256. See the README "Design notes" for the dependency-minimization
# rationale. Callers: see templates/go/ci.yml.
name: Reusable Go CI

on:
  workflow_call:
    inputs:
      allow-untrusted-prs-on-self-hosted:
        description: >-
          Allow this job to run code from a fork (or another repository's) PR when
          runs-on is a self-hosted runner. Only safe on ephemeral, single-use runners.
        type: boolean
        default: false
      runs-on:
        type: string
        default: ubuntu-latest
      go-versions:
        description: JSON array of Go versions for the matrix (setup-go syntax; "stable"/"oldstable"/"1.24" all valid).
        type: string
        default: '["stable"]'
      run-vet:
        description: Run `go vet ./...`.
        type: boolean
        default: true
      run-race:
        description: Run tests with the race detector (`-race`).
        type: boolean
        default: true
      run-lint:
        description: Run golangci-lint (needs a .golangci.yml in the repo).
        type: boolean
        default: false
      golangci-version:
        description: >-
          golangci-lint version. Leave empty (the default) for the pinned,
          hash-verified release (currently v2.15.0); setting that exact value
          also works. Any other value fails the job.
        type: string
        default: ''
      test-command:
        description: Override the test command (default `go test [-race] ./...`).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (go ${{ matrix.go }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(inputs.go-versions) }}
    steps:
      - name: Refuse untrusted PR code on a self-hosted runner
        # Misconfiguration guard, NOT a security boundary: on pull_request the
        # PR author controls the calling workflow and can drop this call. The
        # controls that actually stop it are repo/org settings (README ->
        # Security model). Runs before checkout, so no PR code has run yet.
        if: ${{ runner.environment == 'self-hosted' && !inputs.allow-untrusted-prs-on-self-hosted }}
        # bash explicitly (a Windows runner defaults to pwsh); written for
        # bash 3.2 too (macOS), so no ${var,,}.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request* | workflow_run)
              # A deleted head repo gives an empty HEAD_REPO: treated as foreign.
              head=$(printf '%s' "$HEAD_REPO" | tr '[:upper:]' '[:lower:]')
              this=$(printf '%s' "$THIS_REPO" | tr '[:upper:]' '[:lower:]')
              if [ "$head" != "$this" ]; then
                echo "::error::refusing PR code from ${HEAD_REPO:-a deleted repo} on a self-hosted runner"
                echo "Use ephemeral runners and set allow-untrusted-prs-on-self-hosted to opt in."
                exit 1
              fi
              ;;
            issue_comment)
              echo "::error::refusing comment-triggered PR code on a self-hosted runner"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Guard — skip cleanly if no Go module
        id: guard
        run: |
          if [ -f go.mod ]; then
            echo "has_module=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no go.mod at repo root — skipping Go build/test"
            echo "has_module=false" >> "$GITHUB_OUTPUT"
          fi
      - name: go build
        if: steps.guard.outputs.has_module == 'true'
        run: go build ./...
      - name: go vet
        if: ${{ steps.guard.outputs.has_module == 'true' && inputs.run-vet }}
        run: go vet ./...
      - name: go test
        if: steps.guard.outputs.has_module == 'true'
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          RUN_RACE: ${{ inputs.run-race }}
        run: |
          if [ -n "$TEST_COMMAND" ]; then
            bash -c "$TEST_COMMAND"
          elif [ "$RUN_RACE" = "true" ]; then
            go test -race ./...
          else
            go test ./...
          fi

  lint:
    name: golangci-lint
    if: ${{ inputs.run-lint }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - name: Refuse untrusted PR code on a self-hosted runner
        # Misconfiguration guard, NOT a security boundary: on pull_request the
        # PR author controls the calling workflow and can drop this call. The
        # controls that actually stop it are repo/org settings (README ->
        # Security model). Runs before checkout, so no PR code has run yet.
        if: ${{ runner.environment == 'self-hosted' && !inputs.allow-untrusted-prs-on-self-hosted }}
        # bash explicitly (a Windows runner defaults to pwsh); written for
        # bash 3.2 too (macOS), so no ${var,,}.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request* | workflow_run)
              # A deleted head repo gives an empty HEAD_REPO: treated as foreign.
              head=$(printf '%s' "$HEAD_REPO" | tr '[:upper:]' '[:lower:]')
              this=$(printf '%s' "$THIS_REPO" | tr '[:upper:]' '[:lower:]')
              if [ "$head" != "$this" ]; then
                echo "::error::refusing PR code from ${HEAD_REPO:-a deleted repo} on a self-hosted runner"
                echo "Use ephemeral runners and set allow-untrusted-prs-on-self-hosted to opt in."
                exit 1
              fi
              ;;
            issue_comment)
              echo "::error::refusing comment-triggered PR code on a self-hosted runner"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install golangci-lint (pinned release, SHA-256 verified)
        # Downloaded directly and checked against hard-coded hashes (equal to
        # the release's golangci-lint-2.15.0-checksums.txt). The old
        # `curl install.sh | sh` ran without pipefail, so a failed download
        # exited 0, and it trusted a checksums file from the same release.
        shell: bash
        env:
          GOLANGCI_PINNED: v2.15.0
          GOLANGCI_SHA256_AMD64: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea # linux-amd64
          GOLANGCI_SHA256_ARM64: b4d8f17068b35ee6060cc2f69a16fb48740d706fbba81661c318649c114a6998 # linux-arm64
          GOLANGCI_VERSION: ${{ inputs.golangci-version }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: | # zizmor: ignore[github-env]
          set -euo pipefail
          if [ -n "$GOLANGCI_VERSION" ] && [ "$GOLANGCI_VERSION" != "$GOLANGCI_PINNED" ]; then
            echo "::error::golangci-version '$GOLANGCI_VERSION' is not the pinned $GOLANGCI_PINNED"
            echo "Only the pinned, hash-verified release is supported."
            exit 1
          fi
          if [ "$RUNNER_OS_NAME" != "Linux" ]; then
            echo "::error::golangci-lint install supports Linux runners only; got runner.os='$RUNNER_OS_NAME'"
            exit 1
          fi
          case "$RUNNER_ARCH" in
            X64) arch=amd64; sha="$GOLANGCI_SHA256_AMD64" ;;
            ARM64) arch=arm64; sha="$GOLANGCI_SHA256_ARM64" ;;
            *) echo "::error::no pinned golangci-lint build for runner.arch='$RUNNER_ARCH'"; exit 1 ;;
          esac
          ver="${GOLANGCI_PINNED#v}"
          dir=$(mktemp -d "$RUNNER_TEMP/golangci.XXXXXX")
          tarball="golangci-lint-${ver}-linux-${arch}.tar.gz"
          curl -sSfL -o "$dir/$tarball" \
            "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_PINNED}/${tarball}"
          (cd "$dir" && echo "${sha}  ${tarball}" | sha256sum -c - \
            && tar -xzf "$tarball" --strip-components=1 "golangci-lint-${ver}-linux-${arch}/golangci-lint")
          # A fixed RUNNER_TEMP path, not attacker-controlled.
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/golangci-lint" version
      - name: Run golangci-lint
        run: golangci-lint run ./...
