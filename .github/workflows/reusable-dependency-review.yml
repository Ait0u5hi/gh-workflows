# Reusable: dependency review on PRs. Blocks a PR that introduces a dependency
# with a known vulnerability (or a disallowed license). Uses GitHub's
# first-party actions/dependency-review-action. Requires the repo's Dependency
# Graph to be enabled (default on public repos). Callers: see
# templates/dependency-review.yml.
name: Reusable Dependency Review

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      fail-on-severity:
        description: Minimum severity that fails the check (low|moderate|high|critical).
        type: string
        default: high

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
