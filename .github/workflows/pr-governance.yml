# gh-workflows dogfoods its own governance reusables (local refs).
name: PR Governance

on:
  pull_request:
    # Same trigger set as templates/pr-governance.yml (a test keeps them in
    # step): without `edited`, a corrected PR title never re-runs pr-title.
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contributor-check:
    uses: ./.github/workflows/reusable-contributor-check.yml

  crossplatform-lint:
    uses: ./.github/workflows/reusable-crossplatform-lint.yml

  repo-docs:
    uses: ./.github/workflows/reusable-repo-docs.yml

  pr-title:
    uses: ./.github/workflows/reusable-pr-title.yml

  doc-commands:
    uses: ./.github/workflows/reusable-doc-commands.yml
    with:
      paths: 'CONTRIBUTING.md docs/CONTRIBUTION-STANDARD.md templates/CONTRIBUTING.md'
