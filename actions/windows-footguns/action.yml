# Composite action wrapping the vendored cross-platform footgun linter.
# Referenced by reusable-crossplatform-lint.yml. Using a composite action (rather
# than a second `actions/checkout` of this private repo) lets consumers pull the
# linter with the same same-owner private-access grant that already resolves the
# reusable workflow — no cross-repo token, no repo-visibility change. The full
# gh-workflows repo is fetched alongside the action, so the linter script at
# scripts/check-windows-footguns.py is reachable relative to this action.
name: Windows footgun scan
description: Diff changed Python files against a base ref and scan them for Windows/cross-platform footguns.

inputs:
  base-ref:
    description: Base branch to diff changed files against.
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Scan changed Python files
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -euo pipefail
        SCRIPT="${GITHUB_ACTION_PATH}/../../scripts/check-windows-footguns.py"
        BASE=$(git merge-base "origin/${BASE_REF}" HEAD 2>/dev/null || true)

        # NUL-delimited into a bash array, never `tr '\n' ' '` + unquoted
        # word-split: a changed path containing a space (or any byte but
        # NUL) must survive as a single argv element to the checker.
        #
        # --diff-filter=d excludes Deleted paths only — there is nothing on
        # disk left to scan for one, and passing it through used to make the
        # checker count it as a no-op "skipped" path for no reason. It
        # deliberately does NOT use an allow-list like --diff-filter=AM:
        # that would also exclude Renamed/Copied paths, silently stopping
        # the scan of a file that was renamed with edits. -M turns an
        # unmodified rename's delete+add pair into a single R entry (so the
        # d-filter has nothing to drop); -C (copy detection) is not enabled
        # — it's expensive, and a copy still shows up as a plain Added path
        # here, which is still scanned correctly.
        #
        # The NUL-delimited listing is written to a plain temp file and
        # read back, never piped straight into the while-loop via process
        # substitution (`< <(...)`). Process substitution runs the git
        # command in a subshell whose exit status `set -e` never sees — a
        # failing `git diff`/`git ls-files` (not a git repo, a corrupted
        # checkout, a bad base ref) would silently produce no output, so
        # FILES stayed empty and the step printed its own benign "No Python
        # files to scan." and exited 0, indistinguishable from a real
        # empty diff. Writing to a file first keeps the git command a
        # plain simple command in the main shell, so `set -e` aborts the
        # step the moment it fails.
        FILE_LIST_DIR=$(mktemp -d)
        FILE_LIST="${FILE_LIST_DIR}/changed-py-files.nul"
        if [ -n "$BASE" ]; then
          git diff -z -M --diff-filter=d --name-only "${BASE}..HEAD" -- '*.py' > "$FILE_LIST"
        else
          git ls-files -z -- '*.py' > "$FILE_LIST"
        fi
        FILES=()
        while IFS= read -r -d '' f; do
          FILES+=("$f")
        done < "$FILE_LIST"
        rm -rf "$FILE_LIST_DIR"

        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "No Python files to scan."
          exit 0
        fi
        printf 'Scanning:\n'
        printf '  %s\n' "${FILES[@]}"

        # This step's result is ALWAYS exactly the checker's exit code — we
        # never grep its stdout (e.g. for the checker's own "NOT-APPLICABLE"
        # line) to decide pass/fail. The checker scans attacker-influenced
        # source: a file literally named NOT-APPLICABLE.py, or a matched
        # source line that happens to contain that text, would let crafted
        # content turn a real footgun finding (exit 1) into a false
        # "neutral" if we keyed off text instead of the exit code. The
        # checker's NOT-APPLICABLE line (printed to stdout above when it
        # applies — e.g. every changed .py file turned out to be excluded)
        # is informational for a human reading the log; it changes nothing
        # here, because it already shares exit 0 with a clean pass in the
        # checker's own contract (see its docstring).
        #
        # `--` before the file list is load-bearing, not decorative: the
        # checker's argparse defines --all/--diff/--list, and without a
        # `--` boundary a changed file literally named e.g. `--diff=HEAD.py`
        # (or its unambiguous abbreviation `--dif=x.py`) is consumed as the
        # --diff option instead of reaching `paths`. That silently replaces
        # the whole file list with get_diff_files("HEAD.py") — usually an
        # unresolvable ref, which used to report NOT-APPLICABLE/exit 0 and
        # hide a real footgun in another changed file. `--` makes every
        # token after it positional, even one that is itself the literal
        # string `--` (argparse only treats the FIRST `--` as the
        # separator), so an option-shaped filename always reaches the
        # checker as a path to scan.
        set +e
        python3 "$SCRIPT" -- "${FILES[@]}"
        rc=$?
        set -e
        exit "$rc"
