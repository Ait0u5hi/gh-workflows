# Composite action backing reusable-content-scan.yml. Installs a pinned,
# SHA-256-verified ripgrep, then runs the scan logic in
# scripts/content-scan.sh. Using a composite action (rather than
# a second `actions/checkout` of this repo) lets the reusable workflow reach
# scripts/content-scan.sh with the same same-owner grant that already resolved
# it — no extra token, no repo-visibility change. The full gh-workflows repo is
# fetched alongside the action, so the script is reachable relative to this
# action's own path.
name: Content scan
description: >-
  Grep the checked-out tree for caller-supplied forbidden patterns (a
  committed file, a secret, or both), redacting matched text from the log
  whenever a secret is in play.

inputs:
  patterns-file:
    description: Path (in the caller repo) to the ripgrep patterns file. Optional if patterns-secret is set.
    required: false
    default: .github/content-scan-patterns.txt
  patterns-secret:
    description: >-
      Newline-separated ripgrep regexes (same format as patterns-file) — pass
      secrets.patterns from the caller's workflow_call. Never interpolated
      into the script; only ever reaches it via env.
    required: false
    default: ""
  paths:
    description: Space-separated paths to scan.
    required: false
    default: "."
  exclude:
    description: Whitespace-separated ripgrep globs to exclude (each passed as --glob '!<glob>').
    required: false
    default: ""
  redact-matches:
    description: auto (on iff patterns-secret is set) | true | false.
    required: false
    default: auto
  pcre2:
    description: Enable PCRE2 (-P) for lookaround patterns in either pattern source.
    required: false
    default: "false"

branding:
  icon: search
  color: red

runs:
  using: composite
  steps:
    - name: Install pinned ripgrep (SHA-256 verified)
      id: rg
      shell: bash
      env:
        # ripgrep 15.2.0 (hashes match upstream's .sha256 assets). Built with
        # PCRE2 statically linked. Always installed, never taken from PATH: an
        # `rg` already on a (persistent, self-hosted) runner could be one a
        # previous job planted, and it would be handed the secret patterns.
        RG_VERSION: "15.2.0"
        RG_SHA256_AMD64: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c # x86_64-unknown-linux-musl
        RG_SHA256_ARM64: a740b91c82eaf9914cfedd353572f2791cbe0162c84101ee0951058f4dcbc90d # aarch64-unknown-linux-gnu
      run: |
        set -euo pipefail
        if [ "$(uname -s)" != "Linux" ]; then
          echo "::error::actions/content-scan supports Linux runners only (pinned Linux ripgrep builds); got $(uname -s)"
          exit 1
        fi
        case "$(uname -m)" in
          x86_64) target=x86_64-unknown-linux-musl; sha="$RG_SHA256_AMD64" ;;
          aarch64|arm64) target=aarch64-unknown-linux-gnu; sha="$RG_SHA256_ARM64" ;;
          *) echo "::error::no pinned ripgrep release for architecture $(uname -m)"; exit 1 ;;
        esac
        # A fresh temp dir, never the checked-out PR tree (where a committed
        # symlink under the tarball's name could redirect the write).
        dir=$(mktemp -d "${RUNNER_TEMP:-/tmp}/rg.XXXXXX")
        tarball="ripgrep-${RG_VERSION}-${target}.tar.gz"
        curl -sSfL -o "$dir/$tarball" \
          "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${tarball}"
        (cd "$dir" && echo "${sha}  ${tarball}" | sha256sum -c - \
          && tar -xzf "$tarball" --strip-components=1 "ripgrep-${RG_VERSION}-${target}/rg")
        rm -f "$dir/$tarball"
        echo "rg-bin=$dir/rg" >>"$GITHUB_OUTPUT"
        "$dir/rg" --version | head -1
        "$dir/rg" --pcre2-version | head -1

    - name: Scan tree for forbidden content
      shell: bash
      env:
        PATTERNS_FILE: ${{ inputs.patterns-file }}
        PATTERNS_SECRET: ${{ inputs.patterns-secret }}
        SCAN_PATHS: ${{ inputs.paths }}
        EXCLUDE_GLOBS: ${{ inputs.exclude }}
        REDACT: ${{ inputs.redact-matches }}
        PCRE2: ${{ inputs.pcre2 }}
        RG_BIN: ${{ steps.rg.outputs.rg-bin }}
      run: "${GITHUB_ACTION_PATH}/../../scripts/content-scan.sh"
